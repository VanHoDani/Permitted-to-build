name: Test and publish dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pages: write
  id-token: write
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Test the published package in Chromium
        run: |
          python3 -m http.server 4173 --directory docs > /tmp/dashboard-server.log 2>&1 &
          node tests/browser-smoke.cjs 2>&1 | tee /tmp/browser-check.log
      - name: Record browser diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const log = fs.existsSync("/tmp/browser-check.log") ? fs.readFileSync("/tmp/browser-check.log", "utf8") : "Browser test did not start.";
            await github.rest.checks.create({owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha, name: "Browser diagnostics", status: "completed", conclusion: "neutral", output: {title: "Browser test log", summary: log.slice(-50000)}});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check-results
          path: test-results
  publish:
    needs: browser-check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
