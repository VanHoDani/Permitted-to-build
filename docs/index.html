<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permitted to Build</title><style>html,body{margin:0;background:#131516;color:#f0f1ed;font:16px system-ui;height:100%}#status{padding:28px;max-width:650px;line-height:1.6}#status strong{color:#e2b448}iframe{border:0;width:100%;height:100%;display:block}a{color:#83c6af}</style></head><body><div id="status" role="status"><strong>Permitted to Build</strong><p>Loading the relationship dashboard…</p></div><script>
(async()=>{const status=document.getElementById('status');try{if(!window.DecompressionStream)throw Error('Please open this dashboard in a current version of Chrome, Edge, Firefox or Safari.');const manifestResponse=await fetch('./payload-manifest.json');if(!manifestResponse.ok)throw Error('The dashboard manifest could not load.');const manifest=await manifestResponse.json();const pieces=await Promise.all(manifest.parts.map(async name=>{const response=await fetch('./'+name);if(!response.ok)throw Error('A dashboard asset could not load. Please refresh.');return response.text();}));const raw=atob(pieces.join(''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();}catch(error){status.innerHTML='<strong>Permitted to Build</strong>';const message=document.createElement('p');message.textContent=error.message;status.appendChild(message);const retry=document.createElement('button');retry.textContent='Retry loading';retry.onclick=()=>location.reload();status.appendChild(retry);}})();
</script></body></html>
